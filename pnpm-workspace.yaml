packages:
  - packages/*
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  # vue-demi (dépendance de Scalar) : fichiers Vue 3 déjà publiés, script d'installation inutile
  vue-demi: false
  # unrs-resolver (résolution des imports pour ESLint) : binaire fourni par ses dépendances optionnelles, le
  # script ne fait que le télécharger s'il manque
  unrs-resolver: false
  # simple-git-hooks : son script installe les hooks git déclarés dans package.json (commit-msg → commitlint)
  simple-git-hooks: true
# Contournement local (2026-09-29) : le module natif de oxc-transform 0.143.0 (dépendance de
# Nuxt 3.21) est bloqué par le « Contrôle intelligent des applications » de Windows ; la 0.141.0
# est acceptée. Hors de la plage déclarée par Nuxt (^0.143.0) : à retirer dès que possible.
overrides:
  oxc-transform: 0.141.0
