packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  # vue-demi (dépendance de Scalar) : fichiers Vue 3 déjà publiés, script d'installation inutile
  vue-demi: false
  # unrs-resolver (résolution des imports pour ESLint) : binaire fourni par ses dépendances optionnelles, le
  # script ne fait que le télécharger s'il manque
  unrs-resolver: false
  # simple-git-hooks : son script installe les hooks git déclarés dans package.json (commit-msg → commitlint)
  simple-git-hooks: true
overrides:
  # Correctifs de sécurité de dépendances indirectes (audit du 2026-11-06, security/audit.mjs) : même version
  # majeure que celle qu'attend le paquet parent. Chaque ligne se retire dès que le parent tire lui-même une
  # version corrigée (pnpm why <paquet>).
  # - vue-i18n et @intlify/* (par @nuxtjs/i18n) : embarqués par la build (serveur et navigateur).
  vue-i18n@<11.4.14: ^11.4.14
  '@intlify/core@<11.4.14': ^11.4.14
  '@intlify/core-base@<11.4.14': ^11.4.14
  '@intlify/shared@<11.4.14': ^11.4.14
  '@intlify/message-compiler@<11.4.14': ^11.4.14
  # - outils de Nuxt (DevTools, Vite), de Prisma, de release-it et du site : jamais livrés, corrigés quand même.
  seroval@<1.6.11: ^1.6.11
  node-forge@<1.4.1: ^1.4.1
  launch-editor@<2.14.2: ^2.14.2
  shell-quote@<1.11.0: ^1.11.0
  serialize-javascript@>=7 <7.1.3: ^7.1.3
  fast-uri@>=3 <3.1.9: ^3.1.9
  ip-address@>=10 <10.7.4: ^10.7.4
  undici@>=7 <7.30.1: ^7.30.1
  undici@>=8 <8.12.2: ^8.12.2
  postcss-selector-parser@>=6 <6.1.5: ^6.1.5
