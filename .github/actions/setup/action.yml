name: Préparer l'environnement
description: >-
  Node (version de .nvmrc), pnpm (version du champ packageManager, par corepack) et dépendances installées
  depuis le fichier de verrouillage, avec le magasin pnpm en cache (sauf `cache: 'false'`). À utiliser après
  actions/checkout.

inputs:
  filter:
    description: >-
      Sélecteur pnpm des projets à installer (ex. `@surge-media/website...` : le site et ses dépendances).
      Vide : tout le dépôt.
    required: false
    default: ''
  cache:
    description: >-
      'false' : sans cache du magasin pnpm. Pour les workflows de publication, qu'un cache écrit par un autre
      workflow ne doit pas pouvoir influencer (empoisonnement de cache).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # Le magasin pnpm a son propre cache ci-dessous (coupé dans les publications) : pas de cache implicite
        # de setup-node, qu'un autre workflow pourrait remplir (alerte cache-poisoning de zizmor).
        package-manager-cache: false

    - name: pnpm (corepack)
      id: pnpm
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable
        echo "store-path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache != 'false'
      with:
        path: ${{ steps.pnpm.outputs.store-path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    # Tout le dépôt : lance aussi `nuxt prepare` et la génération des trois clients Prisma (script `prepare`
    # du core).
    - name: Dépendances
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm install --frozen-lockfile ${FILTER:+--filter "$FILTER"}
