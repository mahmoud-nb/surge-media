# OpenSSF Scorecard : pratiques de sécurité du dépôt (protection des branches, actions épinglées, permissions,
# revue du code, dépendances…), notées et publiées sur scorecard.dev. Chaque semaine et à chaque push sur main. Réservé
# aux dépôts publics : le job est sauté tant que le dépôt est privé et s'active de lui-même à sa publication
# (.claude/architecture-ci-security.md, SC7). Badge à ajouter au README le jour de la publication.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '23 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      # Résultats dans Security › Code scanning, et publication signée sur scorecard.dev.
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
