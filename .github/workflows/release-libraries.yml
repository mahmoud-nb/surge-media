# Publication des librairies front, quand une release GitHub de tag libs-vX.Y.Z est publiée —
# créée par `pnpm release:libs` — ou à la main pour un tag existant (Actions › Release (libraries) › Run
# workflow), pour relancer une publication interrompue : un paquet déjà publié en cette version est sauté.
# Les releases du core (tags vX.Y.Z) sont publiées par release.yml.
#
#   1. packages : la version du tag doit être celle des deux paquets ; vérifications, build, archives et essai
#      d'installation (packages/scripts/pack-smoke.mjs) ;
#   2. npm : publication de ces archives (@surge-media/client puis @surge-media/vue, qui en dépend), étiquette
#      `latest` (plus haute version stable), `next` (préversion) ou `release-X.Y` (correctif d'une ancienne
#      ligne), avec provenance si le dépôt est public ; publication de confiance (OIDC) ou secret NPM_TOKEN ;
#   3. assets : archives et SHA256SUMS joints à la release GitHub ; attestation de provenance si le dépôt est public.
#
# Audit des dépendances npm (bloquant) avant tout ; sans cache pnpm (un cache écrit par un autre workflow ne doit
# pas pouvoir influencer une version publiée) ; actions tierces épinglées par empreinte de commit
# (.claude/architecture-ci-security.md).
name: Release (libraries)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag à publier (ex. libs-v0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-libraries-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  packages:
    name: Vérifications et archives
    # Releases des librairies seulement (celles du core ont des tags vX.Y.Z).
    if: startsWith(github.event.release.tag_name || inputs.tag, 'libs-v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # Tous les tags : une version n'est « latest » que si c'est la plus haute version stable.
          fetch-depth: 0
          persist-credentials: false

      # Tout le dépôt : les tests du client recoupent sa logique avec les modules du core.
      - uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Version du tag = version des paquets
        id: version
        run: |
          node packages/scripts/check-release.mjs --tag "$TAG"
          version="${TAG#libs-v}"
          highest="$(git tag --list 'libs-v[0-9]*' | sed 's/^libs-v//' | grep -v -- '-' | sort -V | tail -n 1)"
          # Préversion → « next » ; correctif d'une ancienne ligne (branche release/X.Y) → « release-X.Y », sans
          # déplacer « latest ».
          case "$version" in
            *-*) npm_tag=next ;;
            *) if [ "$version" = "$highest" ]; then npm_tag=latest; else npm_tag="release-${version%.*}"; fi ;;
          esac
          {
            echo "version=$version"
            echo "npm-tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version — npm : $npm_tag"

      - name: Audit des dépendances npm
        run: node security/audit.mjs

      - name: Lint
        run: pnpm --filter "./packages/*" lint

      - name: Typecheck
        run: pnpm --filter "./packages/*" typecheck

      - name: Tests
        run: pnpm --filter "./packages/*" test

      - name: Contrastes du thème
        run: pnpm --filter @surge-media/client a11y:contrast

      - name: Build et publint
        run: pnpm packages:build

      - name: Archives et essai d'installation
        run: node packages/scripts/pack-smoke.mjs --out "$GITHUB_WORKSPACE/artifacts"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libraries
          path: artifacts/*.tgz
          if-no-files-found: error

  npm:
    name: Publication npm
    needs: packages
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # Publication de confiance (OIDC, sans jeton) et attestation de provenance.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libraries
          path: artifacts

      - name: Publication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.packages.outputs.version }}
          DIST_TAG: ${{ needs.packages.outputs.npm-tag }}
          # La provenance exige un dépôt public.
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          # Sans NPM_TOKEN : publication de confiance, à déclarer sur npmjs.com pour chaque paquet.
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          # Le client d'abord : @surge-media/vue en dépend.
          for name in client vue; do
            if npm view "@surge-media/$name@$VERSION" version >/dev/null 2>&1; then
              echo "@surge-media/$name@$VERSION est déjà publiée : rien à faire."
              continue
            fi
            npm publish "artifacts/surge-media-$name-$VERSION.tgz" --access public --tag "$DIST_TAG" --provenance="$PROVENANCE"
          done

  assets:
    name: Archives jointes à la release
    needs: [packages, npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Attestation de provenance des archives (dépôt public seulement).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libraries
          path: artifacts

      - name: Empreintes
        run: cd artifacts && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS

      - name: Attestation de provenance des archives
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tgz

      - name: Ajout à la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/*.tgz artifacts/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
