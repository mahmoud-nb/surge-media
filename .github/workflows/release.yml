# Publication d'une version du core, quand une release GitHub est publiée — créée par `pnpm release`
# (tag vX.Y.Z) — ou à la main pour un tag existant (Actions › Release › Run workflow), pour relancer une
# publication interrompue : chaque étape déjà faite est sautée ou écrasée à l'identique. Les librairies front
# (tags libs-vX.Y.Z) ont leur propre workflow : release-libraries.yml.
#
#   1. package : la version du tag doit être celle du package.json ; audit des dépendances npm (bloquant),
#      vérifications, build, archive du paquet, essai d'installation, SBOM CycloneDX du paquet installé ;
#   2. npm : publication de cette archive, étiquette `latest` (plus haute version stable), `next` (préversion) ou
#      `release-X.Y` (correctif d'une ancienne ligne), avec provenance si le dépôt est public ; publication de
#      confiance (OIDC) ou secret NPM_TOKEN ;
#   3. docker : image amd64 construite et analysée (Trivy, bloquant) avant toute publication, puis images
#      amd64 + arm64 construites depuis la même archive, poussées sur GHCR — X.Y.Z, X.Y, X (à partir de 1.0.0) et
#      latest pour la plus haute version stable, et leurs variantes -slim ; préversion : X.Y.Z seulement ;
#      attestation de provenance GitHub si le dépôt est public ;
#   4. assets : archive du paquet, SBOM et SHA256SUMS joints à la release GitHub ; attestation de l'archive si le
#      dépôt est public.
#
# Sans cache (pnpm, BuildKit) : un cache écrit par un autre workflow ne doit pas pouvoir influencer une version
# publiée. Actions tierces épinglées par empreinte de commit (.claude/architecture-ci-security.md).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag à publier (ex. v0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  package:
    name: Vérifications et paquet
    # Releases du core seulement (tags vX.Y.Z) : celles des librairies (libs-vX.Y.Z) sont publiées par
    # release-libraries.yml. Les autres jobs dépendent de celui-ci et sont sautés avec lui.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      latest: ${{ steps.version.outputs.latest }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # Tous les tags : une version n'est « latest » que si c'est la plus haute version stable.
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache: 'false'

      - name: Version du tag = version du paquet
        id: version
        run: |
          version="$(node -p "require('./apps/core/package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la version de apps/core/package.json ($version)."
            exit 1
          fi
          highest="$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -v -- '-' | head -n 1)"
          # Préversion → étiquette npm « next » ; correctif d'une ancienne ligne (branche release/X.Y) →
          # « release-X.Y », sans déplacer « latest » (npm, Docker) ni le tag Docker majeur.
          case "$version" in
            *-*) latest=false; npm_tag=next ;;
            *) if [ "$TAG" = "$highest" ]; then latest=true; npm_tag=latest; else latest=false; npm_tag="release-${version%.*}"; fi ;;
          esac
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "latest=$latest"
            echo "npm-tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version — npm : $npm_tag, Docker latest : $latest"

      - name: Audit des dépendances npm
        run: node security/audit.mjs

      - name: Licence complète (aucun champ à compléter)
        run: pnpm --filter @surge-media/core license:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Traductions
        run: pnpm i18n:check

      - name: Migrations à jour avec le schéma
        run: pnpm --filter @surge-media/core db:migration --check

      - name: Build
        run: pnpm --filter @surge-media/core build
        env:
          # Même marge de mémoire que dans ci.yml (build Nuxt du core proche du tas par défaut du runner).
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Archive du paquet
        run: cd apps/core && pnpm pack --out "$GITHUB_WORKSPACE/artifacts/surge-media-core.tgz"

      - name: Essai du paquet (installation, init, start)
        run: pnpm --filter @surge-media/core smoke:package "$GITHUB_WORKSPACE/artifacts/surge-media-core.tgz"

      - id: trivy
        uses: $/.github/actions/install-trivy

      # Paquet installé comme chez un utilisateur (sans scripts) : ses dépendances et celles que la build
      # embarque (.output/server/node_modules) figurent dans le SBOM.
      - name: SBOM du paquet (CycloneDX)
        env:
          TRIVY_NO_PROGRESS: 'true'
          TRIVY: ${{ steps.trivy.outputs.path }}
        # Installation ponctuelle voulue : le SBOM décrit ce qu'obtient un utilisateur (`npm install` du paquet publié,
        # résolution fraîche des dépendances, sans lockfile ni scripts).
        run: | # zizmor: ignore[adhoc-packages] SBOM d'une installation utilisateur, scripts désactivés
          dir="$RUNNER_TEMP/sbom"
          mkdir -p "$dir"
          (cd "$dir" && npm init -y >/dev/null && npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/artifacts/surge-media-core.tgz")
          "$TRIVY" rootfs --format cyclonedx --output "$GITHUB_WORKSPACE/artifacts/surge-media-core.cdx.json" "$dir/node_modules"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            artifacts/surge-media-core.tgz
            artifacts/surge-media-core.cdx.json
          if-no-files-found: error

  npm:
    name: Publication npm
    needs: package
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      # Publication de confiance (OIDC, sans jeton) et attestation de provenance.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts

      - name: Publication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
          DIST_TAG: ${{ needs.package.outputs.npm-tag }}
          # La provenance exige un dépôt public.
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          if npm view "@surge-media/core@$VERSION" version >/dev/null 2>&1; then
            echo "@surge-media/core@$VERSION est déjà publiée : rien à faire."
            exit 0
          fi
          # Sans NPM_TOKEN : publication de confiance, à déclarer sur npmjs.com.
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          npm publish artifacts/surge-media-core.tgz --access public --tag "$DIST_TAG" --provenance="$PROVENANCE"

  docker:
    name: Image Docker ${{ matrix.target }} (GHCR)
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Attestation de provenance (dépôt public seulement).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: full
            suffix: ''
          - target: slim
            suffix: -slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Paquet publié sur npm : l'image l'installe, sans refaire la build Nuxt pour chaque architecture.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package-context

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et étiquettes
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ needs.package.outputs.latest }}
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ needs.package.outputs.latest == 'true' && !startsWith(env.TAG, 'v0.') }}
          labels: |
            org.opencontainers.image.title=SurgeMedia
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.revision=${{ needs.package.outputs.revision }}

      # Image amd64 chargée localement et analysée avant toute publication ; ses couches restent dans le cache du
      # constructeur pour la build suivante.
      - name: Build amd64 à analyser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-contexts: package=package-context
          platforms: linux/amd64
          load: true
          tags: surge-media:scan
          build-args: |
            VERSION=${{ needs.package.outputs.version }}
            REVISION=${{ needs.package.outputs.revision }}

      - name: Analyse de l'image (Trivy)
        uses: $/.github/actions/trivy-scan
        with:
          image: surge-media:scan

      - name: Build et publication (amd64, arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-contexts: package=package-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.package.outputs.version }}
            REVISION=${{ needs.package.outputs.revision }}
          provenance: mode=max
          sbom: true

      # Gratuit pour un dépôt public (Sigstore) ; vérification : gh attestation verify oci://<image> --owner <compte>.
      - name: Attestation de provenance de l'image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  assets:
    name: Archive jointe à la release
    needs: [package, npm, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Attestation de provenance de l'archive (dépôt public seulement).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts

      - name: Noms versionnés et empreintes
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cd artifacts
          mv surge-media-core.tgz "surge-media-core-${VERSION}.tgz"
          mv surge-media-core.cdx.json "surge-media-core-${VERSION}.cdx.json"
          sha256sum "surge-media-core-${VERSION}.tgz" "surge-media-core-${VERSION}.cdx.json" > SHA256SUMS
          cat SHA256SUMS

      - name: Attestation de provenance de l'archive
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/surge-media-core-*.tgz

      - name: Ajout à la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "artifacts/surge-media-core-${VERSION}.tgz" \
            "artifacts/surge-media-core-${VERSION}.cdx.json" \
            artifacts/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
