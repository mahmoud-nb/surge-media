# Site public et documentation (apps/website, Astro Starlight) sur GitHub Pages.
#   - pull request : build, types (astro check) et liens internes, sans publication ;
#   - push sur main (chaque merge) ou lancement à la main : même chose, puis publication sur GitHub Pages.
# L'adresse publique (domaine et chemin de base) vient de la configuration Pages du dépôt : passer à un domaine
# personnalisé ne demande aucune modification ici.
#
# Prérequis (une fois) : Settings › Pages › Build and deployment › Source = « GitHub Actions ».
name: Website

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .nvmrc
      - .github/workflows/website.yml
      - .github/actions/setup/**
  pull_request:
    paths:
      - apps/website/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .nvmrc
      - .github/workflows/website.yml
      - .github/actions/setup/**
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois ; une pull request mise à jour annule son build précédent.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : date de dernière mise à jour de chaque page (lastUpdated).
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          filter: '@surge-media/website...'

      - name: Adresse publique (GitHub Pages)
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Pull request : adresse par défaut (astro.config.mjs). Sinon : origine et chemin de base de Pages
      # (chemin vide avec un domaine personnalisé).
      - name: Variables de build
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$ORIGIN" ]; then
            echo "SITE_URL=$ORIGIN" >> "$GITHUB_ENV"
            echo "BASE_PATH=${BASE:-/}" >> "$GITHUB_ENV"
          fi

      - name: Types (astro check)
        run: pnpm --filter @surge-media/website typecheck

      - name: Build
        run: pnpm --filter @surge-media/website build

      - name: Liens internes
        run: pnpm --filter @surge-media/website check:links

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: apps/website/dist

  deploy:
    name: Publication (GitHub Pages)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
