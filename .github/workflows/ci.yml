# Intégration continue : à chaque push sur main et sur chaque pull request.
#   - vérifications : messages de commit (pull request), lint, typecheck, tests, traductions, contrastes,
#     migrations, build des bibliothèques (packages/*) ;
#   - sécurité : audit des dépendances npm (security/audit.mjs), secrets dans les nouveaux commits (gitleaks),
#     analyse des workflows (zizmor) ;
#   - paquet npm : build, archive, essai d'installation (init, start, /api/health) ;
#   - image Docker : construite depuis cette archive (amd64), analysée (Trivy), démarrée, sonde /api/health.
# Actions tierces épinglées par empreinte de commit (version en commentaire, tenue à jour par Dependabot).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : commitlint lit les commits de la pull request.
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Messages de commit (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Traductions
        run: pnpm i18n:check

      - name: Contrastes des thèmes (administration, composants)
        run: pnpm a11y:contrast

      - name: Build des bibliothèques (client, vue) et publint
        run: pnpm packages:build

      - name: Archives des bibliothèques et essai d'installation
        run: pnpm packages:smoke

      - name: Migrations à jour avec le schéma
        run: pnpm --filter @surge-media/core db:migration --check

  security:
    name: Sécurité
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : gitleaks lit les commits du push ou de la pull request.
          fetch-depth: 0
          persist-credentials: false

      # L'audit lit le fichier de verrouillage : Node et pnpm suffisent, sans installer les dépendances.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: pnpm (corepack)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack enable

      - name: Tests du script d'audit
        run: node --test security/audit.test.mjs

      - name: Audit des dépendances npm
        run: node security/audit.mjs

      - name: Commits à examiner
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "log-opts=$BASE_SHA..$HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "log-opts=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "log-opts=-1" >> "$GITHUB_OUTPUT"
          fi

      - name: Secrets dans les nouveaux commits
        uses: $/.github/actions/gitleaks
        with:
          log-opts: ${{ steps.range.outputs.log-opts }}

      - name: Analyse des workflows (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          # Sans GitHub Advanced Security (dépôt privé) : résultats dans le journal, échec s'il y en a.
          advanced-security: false

  package:
    name: Paquet npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Build
        run: pnpm --filter @surge-media/core build
        env:
          # Tas de Node par défaut ≈ 2 Go sur le runner : la build Nuxt du core le frôle (manque de mémoire à
          # la fin de la build Nitro). 4 Go laissent de la marge sur une machine de 7-8 Go.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Archive du paquet
        run: cd apps/core && pnpm pack --out "$GITHUB_WORKSPACE/artifacts/surge-media-core.tgz"

      - name: Essai du paquet (installation, init, start)
        run: pnpm --filter @surge-media/core smoke:package "$GITHUB_WORKSPACE/artifacts/surge-media-core.tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/surge-media-core.tgz
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Image Docker
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package-context

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (depuis l'archive du paquet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: full
          build-contexts: package=package-context
          load: true
          tags: surge-media:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Analyse de l'image (Trivy)
        uses: $/.github/actions/trivy-scan
        with:
          image: surge-media:ci

      - name: Démarrage et sonde /api/health
        run: |
          docker run -d --name surge-media -p 3000:3000 -e NUXT_SITE_URL=http://localhost:3000 surge-media:ci
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs surge-media
          exit 1
